[tool.poetry]
name = "quonfig"
version = "1.2.1"
description = "Python SDK for Quonfig — feature flags and configuration management"
license = "MIT"
authors = ["Quonfig <hello@quonfig.com>"]
readme = "README.md"
packages = [{include = "quonfig"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = ">=2.33.0"
sseclient-py = "^1.7.2"
mmh3 = ">=3.0.0,<6.0.0"
# >=48.0.1 floors out GHSA-537c-gmf6-5ccf (bundled OpenSSL CVE in the 48.0.0
# wheel); pip-audit in CI fails on anything below. cryptography is transitive
# (pulled via requests); this floor keeps the locked resolution patched.
cryptography = ">=48.0.1"
tenacity = ">=8.0.0"
isodate = ">=0.6.1,<0.8.0"
packaging = ">=21.0"
# Opt-in data_dir_auto_reload uses watchfiles (Rust-backed notify wrapper).
# Always installed: keeps the optional-extras matrix simple and matches
# sdk-node which uses Node's built-in fs.watch (no extras gate).
watchfiles = ">=0.21,<2.0"
structlog = {version = ">=24.0", optional = true}

[tool.poetry.extras]
structlog = ["structlog"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-mock = "^3.0"
pytest-cov = ">=5,<8"
mypy = ">=1,<3"
ruff = ">=0.4,<0.16"
responses = ">=0.25,<0.27"
structlog = ">=24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["isodate", "isodate.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"chaos/**" = ["E501"]
"quonfig/operators.py" = ["E501"]

[tool.pytest.ini_options]
# Chaos harness lives in `chaos/` and only runs via scripts/run-chaos.sh; keep
# default `pytest` runs scoped to `tests/`. Invoke chaos with `pytest chaos/`.
testpaths = ["tests"]
