# Dependabot version updates (SOC 2 SSDLC, qfg-66ko.3). Weekly; minor and
# patch bumps are grouped into one PR per ecosystem, majors stay separate.
# Security updates are enabled in the repo settings and are not grouped here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - python
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Runtime dependencies of the published package (main group, not dev).
      # Our constraint is the floor customers must install, so a major bump
      # here forces every customer onto that major. Raise these floors
      # deliberately in a release, not via Dependabot.
      - dependency-name: "requests"
        update-types: ["version-update:semver-major"]
      - dependency-name: "urllib3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mmh3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cryptography"
        update-types: ["version-update:semver-major"]
      - dependency-name: "watchfiles"
        update-types: ["version-update:semver-major"]
      - dependency-name: "structlog"
        update-types: ["version-update:semver-major"]
