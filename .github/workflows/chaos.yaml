name: Chaos

# Runs the cross-SDK chaos harness (toxiproxy + scenarios from
# integration-test-data/chaos) against sdk-python. Boots api-delivery in
# fixture mode and drives every scenario in scenarios/*.yaml through it.
#
# Two modes:
#   - smoke   : skips 11-null-hypothesis (the 30-minute idle scenario);
#               runs on every push to main + every PR (~18 min wall clock).
#   - full    : every scenario; runs on workflow_dispatch + via the release
#               workflow as a publish gate (~48 min).
#
# Wired via workflow_call so release.yaml can `needs:` it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      mode:
        description: "smoke (skip 11) or full"
        required: false
        type: string
        default: smoke
    secrets:
      QUONFIG_REPO_TOKEN:
        # Read access to the private quonfig/api-delivery repo. Reusable
        # workflows do NOT inherit caller secrets implicitly — the caller
        # (release.yaml) must pass this through, or the "Checkout
        # api-delivery" step fails with "Input required and not supplied:
        # token" and the publish gate can never go green.
        required: true
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (skip 11) or full"
        required: false
        type: choice
        options: [smoke, full]
        default: smoke

jobs:
  chaos:
    name: Chaos (${{ inputs.mode || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Dependabot PRs run with a restricted token context and have no access
    # to repo Actions secrets, so `QUONFIG_REPO_TOKEN` (needed to check out
    # the private api-delivery repo) is empty and the checkout step fails
    # fast with "Input required and not supplied: token". Skip the harness
    # for those PRs — the same commit re-runs chaos on push to main once
    # merged, and the release workflow gates publish on the full suite.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout sdk-python
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: sdk-python

      - name: Checkout integration-test-data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Pinned per the 2026-05-13 reliability audit so the chaos
          # gate moves only when the scenarios are deliberately
          # rev'd. Bump alongside the matching SDK change.
          ref: v2026.05.13

      - name: Checkout api-delivery
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # api-delivery is private; the default GITHUB_TOKEN cannot
          # read it. A PAT or fine-grained token with read access to
          # quonfig/api-delivery must be configured as the repo secret
          # QUONFIG_REPO_TOKEN. Without it this step fails fast and
          # the chaos gate is red — by design, until the secret is
          # provisioned.
          repository: quonfig/api-delivery
          path: api-delivery
          ref: main
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.26'
          cache-dependency-path: api-delivery/go.sum

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1
        with:
          version: "1.8.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install mise
        # The chaos wrapper invokes `mise exec -- poetry run pytest`.
        # On CI we want mise to be a thin passthrough — it just needs
        # to exist on PATH so `mise exec --` resolves to the system
        # poetry that snok/install-poetry installed.
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v2.1.11

      - name: Install sdk-python deps
        working-directory: sdk-python
        run: poetry install --no-interaction

      - name: Verify docker compose available
        run: docker compose version

      - name: Run chaos harness
        working-directory: sdk-python
        env:
          # Smoke skips 11-null-hypothesis (30 min idle). Full suite
          # runs everything. The wrapper honors CHAOS_SKIP.
          CHAOS_SKIP: ${{ inputs.mode == 'full' && '' || '11' }}
        run: ./scripts/run-chaos.sh

      - name: Upload chaos logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: chaos-logs-${{ github.run_id }}
          path: |
            sdk-python/.chaos-api-delivery
            sdk-python/chaos-*.log
          if-no-files-found: ignore
          retention-days: 7
