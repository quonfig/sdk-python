name: Failover Chaos

# Runs the failover + canonical-ordering chaos rigs (toxiproxy + the
# scenarios-failover/ and scenarios-ordering/ corpus from
# integration-test-data/chaos) against sdk-python. Fires on every push to main +
# every PR alongside the existing Chaos workflow (chaos.yaml, single-upstream
# suite). Mirrors sdk-go/.github/workflows/failover-chaos.yaml (qfg-7h5d.1.6).
#
# Unlike chaos.yaml, the pytest runner (chaos/test_failover_chaos.py) builds
# api-delivery and spawns its own fixture upstream(s) — one upstream behind the
# primary+secondary proxies for failover, two upstreams at divergent
# Meta.generations for ordering — so this job only has to boot toxiproxy via
# scripts/run-failover-chaos.sh. Wall clock ~2 min.
#
# Scenarios gated here: f01-f05 (failover) + o01-o05 (ordering). Nothing is
# skipped: the parallel-failover hedge (qfg-7h5d.1.14) makes the HTTP
# config-fetch a hedge (primary first; secondary in parallel only on a slow or
# erroring primary), so o01 (fast primary wins, secondary never contacted), o03
# (heal forward to a slow newer primary), and o05 (slow older primary loses to a
# fast newer secondary) all go green. CHAOS_SKIP is cleared below.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Nightly run on main (WS3.2, qfg-41nh.14): post-1.1.0 this suite is
    # otherwise dormant between SDK pushes while api-delivery keeps moving.
    # Cron times are staggered across the six backend SDK repos (06:10-07:25
    # UTC, 15 min apart) to be kind to shared runners and the toxiproxy image
    # pulls. Scheduled runs use repo-level secrets (QUONFIG_REPO_TOKEN is
    # repo-scoped), so the api-delivery checkout works here too. Failure
    # visibility relies on GitHub's default watcher-notification emails —
    # there is no Slack webhook wired into these repos yet.
    - cron: '40 6 * * *'

jobs:
  failover-chaos:
    name: Failover + Ordering Chaos
    runs-on: ubuntu-latest
    # Suite is ~2 min; cap at 30 to absorb warmup + docker pull. Scenarios fail
    # fast inside the runner via their own wall_clock_seconds, so this only
    # kicks in if something hangs.
    timeout-minutes: 30
    # The `secrets` context cannot be referenced in step `if:` conditions, so
    # surface the token's presence as a job-level env var. Dependabot-triggered
    # runs have no access to repo Actions secrets, so HAS_REPO_TOKEN is 'false'
    # for them and the chaos harness steps below are skipped rather than hard
    # failing.
    env:
      HAS_REPO_TOKEN: ${{ secrets.QUONFIG_REPO_TOKEN != '' }}
    steps:
      - name: Checkout sdk-python
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: sdk-python

      - name: Checkout integration-test-data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Pinned so the failover gate moves only when the scenarios are
          # deliberately rev'd. Kept equal to the unit/contract pin in
          # test.yaml (qfg-goi1.1.4). v2026.06.19.1 introduced the reframed
          # corpus (qfg-7h5d.1.14: o01 cold-standby, o05, o03 heal-forward).
          # v2026.10.16.2 adds after_ms + strict expectation keys (qfg-goi1.7);
          # the harness implements both (chaos/timeline.py), so this chaos pin
          # leads test.yaml's until that one is bumped.
          ref: v2026.10.16.2

      - name: Checkout api-delivery
        # api-delivery is private; the default GITHUB_TOKEN cannot read it. A PAT
        # or fine-grained token with read access to quonfig/api-delivery must be
        # configured as the repo secret QUONFIG_REPO_TOKEN. Dependabot runs do
        # NOT have access to repo Actions secrets, so for those the token is
        # empty and the chaos harness is skipped rather than hard failing — a
        # GitHub Actions version bump can't affect the chaos result anyway, and
        # the Test jobs still gate the PR. The two rigs build api-delivery from
        # source (GOWORK=off) to spawn their fixture upstreams.
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: quonfig/api-delivery
          path: api-delivery
          ref: main
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}

      # api-delivery tracks main on purpose (Decision 8, qfg-goi1.1.4). Record
      # the resolved SHA in the run summary so a red run is reproducible.
      - name: Record api-delivery SHA
        if: env.HAS_REPO_TOKEN == 'true'
        run: |
          sha="$(git -C api-delivery rev-parse HEAD)"
          echo "api-delivery @ main resolved to ${sha}"
          echo "api-delivery: \`main\` @ \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"

      - if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.26'
          cache-dependency-path: api-delivery/go.sum

      - name: Set up Python
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        if: env.HAS_REPO_TOKEN == 'true'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1
        with:
          version: "1.8.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install mise
        # The chaos wrapper invokes `mise exec -- poetry run pytest`. On CI we
        # want mise to be a thin passthrough — it just needs to exist on PATH so
        # `mise exec --` resolves to the system poetry that snok/install-poetry
        # installed.
        if: env.HAS_REPO_TOKEN == 'true'
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v2.1.11

      - name: Install sdk-python deps
        if: env.HAS_REPO_TOKEN == 'true'
        working-directory: sdk-python
        run: poetry install --no-interaction

      - name: Verify docker compose available
        if: env.HAS_REPO_TOKEN == 'true'
        run: docker compose version

      - name: Skipped (no api-delivery access token)
        if: env.HAS_REPO_TOKEN != 'true'
        run: |
          echo "QUONFIG_REPO_TOKEN is not available to this run" \
               "(expected for Dependabot PRs)." \
               "Skipping the failover chaos harness; Test jobs still gate this PR."

      - name: Run failover + ordering chaos rigs
        if: env.HAS_REPO_TOKEN == 'true'
        working-directory: sdk-python
        env:
          # Parallel-failover hedge landed (qfg-7h5d.1.14): o01 (cold standby),
          # o03 (heal forward), and the new o05 (slow older primary loses to fast
          # newer secondary) all go green, so nothing is skipped. The full
          # f01-f05 + o01-o05 gate runs. (Empty string clears the script default,
          # which would otherwise re-skip o01.)
          CHAOS_SKIP: ""
        run: ./scripts/run-failover-chaos.sh

      - name: Upload chaos logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: failover-chaos-logs-${{ github.run_id }}
          path: |
            sdk-python/chaos/.chaos-api-delivery-failover
            sdk-python/chaos-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Post failure to Slack
        # The nightly scheduled run posts to #incoming-webhook (org secret
        # SLACK_CI_WEBHOOK) only when it is not green; a hand-dispatched run
        # always posts. PR, push and workflow_call runs never post.
        if: always() && github.workflow == 'Failover Chaos' && ((github.event_name == 'schedule' && job.status != 'success') || github.event_name == 'workflow_dispatch')
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CI_WEBHOOK }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUITE: failover + ordering chaos
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::error::SLACK_CI_WEBHOOK is not available to this run"
            exit 1
          fi
          case "$STATUS" in
            success) icon=":white_check_mark:" ;;
            cancelled) icon=":heavy_minus_sign:" ;;
            *) icon=":rotating_light:" ;;
          esac
          text="${icon} *${GITHUB_REPOSITORY}* ${SUITE} (${GITHUB_EVENT_NAME}): *${STATUS}* <${RUN_URL}|view run>"
          jq -n --arg text "$text" '{text: $text}' |
            curl -sSf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"
