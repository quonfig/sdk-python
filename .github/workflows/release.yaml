name: Release

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  # Chaos harness gates publish — see .github/workflows/chaos.yaml.
  # Full suite (every scenario incl. 11-null-hypothesis, ~48 min) runs
  # before publish can ship. Surfaced by the 2026-05-13 reliability
  # audit.
  chaos:
    uses: ./.github/workflows/chaos.yaml
    with:
      mode: full
    # Reusable workflows do not inherit caller secrets — pass through the
    # api-delivery checkout token explicitly, or the chaos publish gate
    # fails fast on "Checkout api-delivery" and publish is skipped.
    secrets:
      QUONFIG_REPO_TOKEN: ${{ secrets.QUONFIG_REPO_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: [test, chaos]
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a  # v1
        with:
          version: "1.8.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Get local version
        id: local_version
        run: echo "version=$(poetry version -s)" >> $GITHUB_OUTPUT

      - name: Get published version
        id: published_version
        run: |
          published=$(pip index versions quonfig 2>/dev/null | grep -oP '(?<=quonfig \()[\d.]+(?=\))' | head -1 || echo "none")
          echo "version=$published" >> $GITHUB_OUTPUT

      - name: Check if version is new
        id: version_check
        run: |
          local="${{ steps.local_version.outputs.version }}"
          published="${{ steps.published_version.outputs.version }}"
          echo "Local: $local, Published: $published"
          if [ "$local" != "$published" ]; then
            echo "new_version=true" >> $GITHUB_OUTPUT
          else
            echo "new_version=false" >> $GITHUB_OUTPUT
          fi

      - name: Build
        if: steps.version_check.outputs.new_version == 'true'
        run: poetry build --no-interaction

      - name: Publish to PyPI
        if: steps.version_check.outputs.new_version == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1 (v1.9.0)
