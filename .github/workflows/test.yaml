name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout sdk-python
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: sdk-python

      - name: Checkout integration-test-data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Pinned to a tag (not main) so a typo in shared YAML can't
          # break every SDK's CI at once. Bump to a newer tag when
          # adopting new test cases. See integration-test-data/RELEASING.md.
          ref: v2026.05.20

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a  # v1
        with:
          version: "1.8.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: sdk-python
        run: poetry install --no-interaction

      - name: Lint (ruff)
        working-directory: sdk-python
        run: poetry run ruff check .

      - name: Ruff format check
        working-directory: sdk-python
        run: poetry run ruff format --check .

      - name: Typecheck (mypy)
        working-directory: sdk-python
        run: poetry run mypy quonfig

      # Node is needed only to run the integration-test-data generator below.
      - name: Set up Node (integration-test generator)
        if: matrix.python-version == '3.13'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      # The tests/integration/test_*.py files are produced by the
      # integration-test-data generator, not hand-written. Generation is a
      # manual step, so a change to the shared YAML (or the generator) that
      # isn't regenerated here would leave these tests stale while CI stayed
      # green against the old copy. Regenerate from the pinned tag, re-run
      # ruff format (the generator emits unformatted code), and fail if
      # anything differs from what is committed.
      - name: Check generated integration tests are in sync
        if: matrix.python-version == '3.13'
        working-directory: sdk-python
        run: |
          (cd ../integration-test-data/generators && npm ci && npm run generate -- --target=python)
          poetry run ruff format tests/integration/
          git diff --exit-code tests/integration/ \
            || { echo "::error::Generated integration tests are out of sync with integration-test-data. Run 'npm run generate -- --target=python' in integration-test-data/generators, run ruff format, and commit the result."; exit 1; }

      - name: Test
        working-directory: sdk-python
        run: poetry run pytest

      # Export the locked main-group deps to requirements.txt and pass to
      # pip-audit. We do not audit the venv directly because the action would
      # install pip-audit into the same venv and then flag its own transitive
      # deps (e.g. filelock CVEs that don't ship to consumers).
      - name: Export locked runtime deps
        working-directory: sdk-python
        run: poetry export --format requirements.txt --output requirements-audit.txt --without-hashes

      - name: Audit dependencies (pip-audit)
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          inputs: sdk-python/requirements-audit.txt
